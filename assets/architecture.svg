<text x="500" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#89e3d1">VALIDATION &amp; REQUEST CONTROL</text>
<text x="500" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Image / audio bounds · quality checks · interaction state</text>
<text x="500" y="464" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Spoken question → Whisper transcription → transcript review</text>
<text x="500" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">API boundary: authentication, daily quotas and inference access</text>
