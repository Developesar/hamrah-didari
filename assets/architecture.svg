<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1140" viewBox="0 0 1000 1140" role="img" aria-labelledby="title desc"><title id="title">Hamrah Didari architecture</title><desc id="desc">Camera, image, voice and text inputs reach Streamlit or the phone API. Validated requests route to scene understanding, object finding or OCR. Persian response handling produces text, annotated images and optional speech.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#51bca8"/></marker></defs><rect width="1000" height="1140" rx="18" fill="#101b2b"/>
<text x="500" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#ffffff">Hamrah Didari | System Architecture</text>
<text x="500" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Camera, language and speech connected around a Persian-first workflow</text>
<rect x="40" y="110" width="286" height="94" rx="12" fill="#192b3e" stroke="#426276"/>
<text x="183" y="139" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#89e3d1">CAMERA / IMAGE</text>
<text x="183" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Laptop webcam or browser</text>
<text x="183" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Uploaded image / short video</text>
<rect x="357" y="110" width="286" height="94" rx="12" fill="#192b3e" stroke="#426276"/>
<text x="500" y="139" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#89e3d1">SPEECH</text>
<text x="500" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Microphone recording</text>
<text x="500" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">or validated WAV input</text>
<rect x="674" y="110" width="286" height="94" rx="12" fill="#192b3e" stroke="#426276"/>
<text x="817" y="139" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#89e3d1">TEXT QUESTION</text>
<text x="817" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Typed question</text>
<text x="817" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">and selected task</text>
