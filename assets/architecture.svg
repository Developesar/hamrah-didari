<rect x="674" y="650" width="286" height="110" rx="12" fill="#192b3e" stroke="#426276"/>
<text x="817" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#89e3d1">GENERAL TEXT</text>
<text x="817" y="707" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">EasyOCR</text>
<text x="817" y="731" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Image and OCR preprocessing</text>
<path d="M183 760V781H500V807" fill="none" stroke="#51bca8" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M500 760V807" fill="none" stroke="#51bca8" stroke-width="2.5" marker-end="url(#arrow)"/>
