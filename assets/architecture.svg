<rect x="120" y="813" width="760" height="110" rx="12" fill="#192b3e" stroke="#426276"/>
<text x="500" y="842" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#89e3d1">PERSIAN RESPONSE &amp; GUIDANCE</text>
<text x="500" y="870" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Evidence, object positions and Persian text normalization</text>
<text x="500" y="894" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Uncertainty handling and task-specific output boundaries</text>
<text x="500" y="918" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Optional retrieval of clearly separated guidance</text>
<path d="M500 923V952" fill="none" stroke="#51bca8" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="120" y="958" width="760" height="92" rx="12" fill="#192b3e" stroke="#426276"/>
<text x="500" y="987" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#89e3d1">OUTPUT</text>
<text x="500" y="1015" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Readable Persian text · annotated image / object list</text>
<text x="500" y="1039" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Optional Persian speech through configurable TTS adapters</text>
<text x="500" y="1090" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#b0c2d0">Architecture of the complete application; this public repository contains</text>
<text x="500" y="1115" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#b0c2d0">selected processing components and their independent tests.</text>
