<rect x="120" y="250" width="760" height="98" rx="12" fill="#192b3e" stroke="#426276"/>
<text x="500" y="279" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#89e3d1">INTERACTION SURFACES</text>
<text x="500" y="307" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Windows: Streamlit → local pipeline</text>
<text x="500" y="331" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#d7e4ee">Phone: PWA → FastAPI → pipeline</text>
